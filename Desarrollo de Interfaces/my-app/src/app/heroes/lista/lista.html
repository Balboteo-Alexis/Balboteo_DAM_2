
<h3>Lista de héroes</h3>

<button class="btn btn-warning" (click)="eliminarUltimoHeroe()">
  Elimina al último
</button>

@if (heroeEliminado) {
  <h3>Héroe eliminado: {{ heroeEliminado }}</h3>
} @else {
  <h3>Ningún héroe eliminado</h3>
}

<ul class="mt-2 list-group">
  @for (nombre of listaHeroes; track nombre) {
    <li class="list-group-item">{{ nombre }}</li>
  }
</ul>
